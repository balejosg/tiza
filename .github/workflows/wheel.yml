name: Wheel de la release

# Al publicar una release, construye el wheel de su etiqueta y lo sube a la release: los
# instaladores y «tiza actualizar» lo instalan sin git y sin construir nada en el equipo
# del docente (si falta, usan el .zip de la etiqueta).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # solo para subir el wheel a la release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Construir el wheel
        run: uv build --wheel
      - name: Comprobar que el nombre coincide con la etiqueta
        env:
          ETIQUETA: ${{ github.event.release.tag_name }}
        run: test -f "dist/tiza-${ETIQUETA#v}-py3-none-any.whl"
      - name: Subir el wheel a la release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.event.release.tag_name }}
        run: gh release upload "$ETIQUETA" dist/*.whl --clobber
