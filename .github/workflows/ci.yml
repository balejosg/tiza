name: CI

on:
  push:
  pull_request:

# Permisos mínimos del GITHUB_TOKEN: los trabajos solo leen el repositorio.
permissions:
  contents: read

jobs:
  tests:
    # Tests 100 % offline: nunca se contacta con un aula real.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Instalar dependencias
        run: uv sync --extra dev
      - name: Ejecutar los tests
        run: uv run pytest

  instalador:
    # Prueba los scripts de instalación; no contacta con ningún aula real.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      TIZA_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Instalar (macOS)
        if: runner.os == 'macOS'
        run: sh install.sh
      - name: Instalar con el panel (Linux)
        if: runner.os == 'Linux'
        run: TIZA_PANEL=1 sh install.sh
      - name: Instalar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
      - name: Comprobar tiza
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$USERPROFILE/.local/bin:$PATH"
          tiza --help
      - name: Comprobar que tiza instalado trae los datos de normativa
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          export PATH="$HOME/.local/bin:$USERPROFILE/.local/bin:$PATH"
          # la salida se guarda antes de buscar en ella: así un fallo de tiza no lo tapa la tubería
          tiza normativa catalogo --etapa primaria > catalogo.txt
          grep -q "MAD.EP.MAT" catalogo.txt
      - name: Comprobar la ventana de entrada (Windows y macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$USERPROFILE/.local/bin:$PATH"
          for py in "$(uv tool dir)/tiza/bin/python" "$(uv tool dir)/tiza/Scripts/python.exe"; do
            if [ -x "$py" ]; then "$py" -c "import webview; import tiza.ventana as v; print('ventana importable')" && exit 0; fi
          done
          echo "no se encontró el intérprete de tiza" && exit 1
      - name: Comprobar el panel y el acceso del menú de aplicaciones (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          panel="$(uv tool dir --bin)/tiza-panel"
          test -x "$panel" || { echo "Falta $panel"; exit 1; }
          acceso="$HOME/.local/share/applications/tiza.desktop"
          test -f "$acceso" || { echo "Falta el acceso $acceso"; exit 1; }
          grep -qxF "Exec=\"$panel\"" "$acceso" || { echo "El acceso no apunta a $panel"; exit 1; }
          test -f "$HOME/.local/share/icons/tiza.png" || { echo "Falta el icono"; exit 1; }
          "$(uv tool dir)/tiza/bin/python" -c "import webview, PySide6; import tiza.panel.linux; print('panel importable')"
      - name: Comprobar el panel y los accesos del menú Inicio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          $bin = (uv tool dir --bin) | Select-Object -First 1
          $panel = Join-Path $bin 'tiza-panel.exe'
          if (-not (Test-Path -LiteralPath $panel)) { throw "Falta $panel" }
          $acceso = Join-Path ([Environment]::GetFolderPath('Programs')) 'tiza.lnk'
          if (-not (Test-Path -LiteralPath $acceso)) { throw "Falta el acceso $acceso" }
          $destino = (New-Object -ComObject WScript.Shell).CreateShortcut($acceso).TargetPath
          if ($destino -ne $panel) { throw "El acceso apunta a $destino y no a $panel" }

  calidad:
    # Lint, tipos y cobertura mínima. Herramientas efímeras (uvx / --with): no son
    # dependencias del paquete. Sin red hacia el aula.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Instalar dependencias
        run: uv sync --extra dev
      - name: Lint
        run: uvx ruff@0.16.10 check src tests
      - name: Formato
        run: uvx ruff@0.16.10 format --check src tests
      - name: Tipos
        run: uv run --with mypy==2.4.0 --with types-PyYAML --with types-requests mypy
      - name: Tests con cobertura
        run: uv run --with pytest-cov==7.1.0 pytest --cov --cov-report=term-missing --cov-fail-under=80
