<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- La directiva de evaluación la exige el puente de pywebview, que crea sus
     funciones con el constructor Function (webview/js/api.js). No se permiten
     scripts incrustados sin nonce: un HTML inyectado no ejecuta nada, y este
     código nunca evalúa cadenas. Todo se pinta con createElement y textContent. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__NONCE__' 'unsafe-eval'; style-src 'nonce-__NONCE__'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiza</title>
<style nonce="__NONCE__">
:root {
  --fondo: #F7F4EE;      /* papel */
  --papel: #FFFFFF;
  --texto: #22272C;
  --suave: #5E676F;
  --pizarra: #2E3134;    /* la pizarra del logo */
  --marca: #A9D6EF;      /* azul lápiz */
  --marca-fuerte: #7FB9DC;
  --marca-tinta: #14303F;
  --coral: #E9785A;      /* los circuitos */
  --peligro: #C6452F;
  --aviso: #8A5A00;
  --borde: #DED7CB;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
header { background: linear-gradient(135deg, #383C40 0%, var(--pizarra) 55%, #292C2F 100%); color: #F4F7F8; padding: 13px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-bottom: 3px solid var(--marca); }
header img { height: 54px; width: 90px; flex: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
header div { flex: 1; min-width: 0; }
header h1 { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: .4px; }
header p { margin: 4px 0 0; font-size: 12px; color: #B9C2C8; overflow-wrap: anywhere; }
header button { background: transparent; color: #F4F7F8; border-color: rgba(255,255,255,.5); }
header button:hover { background: rgba(255,255,255,.1); border-color: #fff; }
header .confirmar-cierre { flex: 1 1 100%; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding-top: 4px; }
header .confirmar-cierre[hidden] { display: none; }
header .confirmar-cierre span { font-size: 13px; color: #E7DDD8; }
header .confirmar-cierre .peligro { background: var(--peligro); border-color: var(--peligro); color: #fff; }
main { max-width: 820px; margin: 0 auto; padding: 24px 22px 34px; }
.tarjeta { background: var(--papel); border: 1px solid var(--borde); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; box-shadow: 0 2px 3px rgba(46,49,52,.04), 0 12px 28px rgba(46,49,52,.05); }
h2 { font-size: 16px; margin: 0 0 12px; letter-spacing: .1px; }
h2::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); margin-right: 9px; vertical-align: 2px; }
#ver-registro { font-size: 12px; padding: 4px 10px; margin-left: 8px; vertical-align: 1px; }
.acciones { position: sticky; bottom: 0; z-index: 2; margin: 16px -22px -20px; padding: 12px 22px 14px; background: var(--papel); border-top: 1px solid var(--borde); border-radius: 0 0 14px 14px; box-shadow: 0 -8px 16px rgba(46,49,52,.08); }
.acciones p { margin: 0 0 10px; }
.acciones .botones { margin-top: 0; }
p { margin: 7px 0; }
.suave { color: var(--suave); }
.error { color: var(--peligro); }
.aviso { color: var(--aviso); }
label { display: block; font-weight: 600; margin: 14px 0 5px; }
label.casilla { font-weight: 400; margin: 7px 0; }
input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid #D5CEC1; border-radius: 8px; font: inherit; background: #FCFBF8; color: var(--texto); }
input[type="text"]:focus { outline: none; border-color: var(--marca-fuerte); box-shadow: 0 0 0 3px rgba(127,185,220,.28); }
.botones { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 16px; }
button { font: inherit; padding: 9px 17px; border-radius: 8px; border: 1px solid var(--borde); background: var(--papel); color: var(--texto); cursor: pointer; transition: background .12s, border-color .12s; }
button:hover { background: #F3EFE7; border-color: #CFC7B9; }
button:focus-visible { outline: 3px solid rgba(127,185,220,.55); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
button.principal { background: var(--marca); border-color: var(--marca-fuerte); color: var(--marca-tinta); font-weight: 700; }
button.principal:hover { background: #98CBE8; }
button.real { background: var(--coral); border-color: var(--coral); color: #2A1712; font-weight: 700; }
button.real:hover { background: #DE6748; }
button.peligro { background: var(--peligro); border-color: var(--peligro); color: #fff; }
button.peligro:hover { background: #AE3926; }
.documento { border-top: 1px dashed #DDD5C8; padding-top: 12px; margin-top: 14px; }
.documento .titulo { font-weight: 600; }
ul { margin: 8px 0; padding-left: 22px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.contador { margin-top: 10px; }
#registro { font-size: 13px; max-height: 220px; overflow: auto; color: var(--suave); }
#registro::-webkit-scrollbar { width: 8px; }
#registro::-webkit-scrollbar-thumb { background: #D8D1C5; border-radius: 8px; }
#registro li.error { color: var(--peligro); }
::selection { background: var(--marca); color: var(--marca-tinta); }
@media (max-width: 620px) {
  header { padding: 11px 14px; gap: 10px; }
  header img { height: 44px; width: 73px; }
  header h1 { font-size: 20px; }
  main { padding: 16px 12px 26px; }
  .tarjeta { padding: 16px; }
  .acciones { margin: 16px -16px -16px; padding: 12px 16px; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<header>
  <img src="__LOGO__" alt="" width="90" height="54">
  <div>
    <h1>tiza</h1>
    <p id="contexto"></p>
  </div>
  <button type="button" id="cerrar-sesion" hidden>Cerrar la sesión y salir</button>
  <div id="confirmar-cierre" class="confirmar-cierre" hidden>
    <span>El asistente dejará de poder publicar. ¿Cerrar?</span>
    <button type="button" id="cerrar-de-verdad" class="peligro">Cerrar</button>
    <button type="button" id="seguir-trabajando">Seguir trabajando</button>
  </div>
</header>
<main>
  <p id="anuncio" class="sr-only" aria-live="polite"></p>
  <section id="pantalla" class="tarjeta"></section>
  <section class="tarjeta">
    <h2>Registro <button type="button" id="ver-registro" hidden></button></h2>
    <ul id="registro"></ul>
  </section>
</main>
<script nonce="__NONCE__">
"use strict";
(function () {
  var ESPERA_BOTONES = 700;  // ayuda visual: la regla de verdad (0,7 s) está en Python
  var ultimo = null;         // número de la pantalla pintada
  var firmaRegistro = "";
  var enCurso = false;
  var respuestas = [];       // botones que se habilitan a los 0,7 s de pintar la pantalla
  var botonPrincipal = null; // el que activa Enter en un campo de texto de la pantalla
  var pintada = 0;           // cuándo se pintó la pantalla (para la espera de los botones)
  var registroPlegado = false;
  var ultimaPregunta = false;
  var ultimoRegistro = [];
  var cierrePreguntado = false;

  function api() {
    return window.pywebview && window.pywebview.api;
  }

  function el(etiqueta, clase, texto) {
    var nodo = document.createElement(etiqueta);
    if (clase) { nodo.className = clase; }
    if (texto !== undefined && texto !== null) { nodo.textContent = String(texto); }
    return nodo;
  }

  // Los botones de respuesta empiezan deshabilitados; los demás, no.
  function boton(texto, clase, accion, esRespuesta) {
    var nodo = el("button", clase, texto);
    nodo.type = "button";
    nodo.addEventListener("click", accion);
    if (esRespuesta) {
      nodo.disabled = true;
      respuestas.push(nodo);
    }
    return nodo;
  }

  function botones() {
    var caja = el("div", "botones");
    for (var i = 0; i < arguments.length; i++) { caja.appendChild(arguments[i]); }
    return caja;
  }

  function campo(etiqueta, id) {
    var caja = el("div");
    var nombre = el("label", null, etiqueta);
    nombre.htmlFor = id;
    var entrada = el("input");
    entrada.type = "text";
    entrada.id = id;
    entrada.autocomplete = "off";
    entrada.spellcheck = false;
    caja.appendChild(nombre);
    caja.appendChild(entrada);
    return { nodo: caja, entrada: entrada };
  }

  // Siempre con los dos argumentos: pywebview convierte undefined en None.
  function responder(numero, valor) {
    var puente = api();
    if (puente) { puente.responder(numero, valor); }
  }

  function parrafos(nodos, lineas, clase) {
    (lineas || []).forEach(function (linea) { nodos.push(el("p", clase || null, linea)); });
  }

  function zonaDeError(contenedor) {
    var nodo = el("p", "error");
    nodo.hidden = true;
    contenedor.appendChild(nodo);
    return nodo;
  }

  function ponerError(zona, texto) {
    zona.textContent = texto ? "Error: " + texto : "";
    zona.hidden = !texto;
  }

  // Un botón de respuesta puede seguir deshabilitado tras la espera si su condición no se
  // cumple (ningún curso marcado, un campo vacío). La regla de 0,7 s sigue siendo la de Python.
  function actualizarBoton(nodo) {
    if (!nodo) { return; }
    var listo = Date.now() - pintada >= ESPERA_BOTONES;
    nodo.disabled = !listo || (nodo.condicion ? !nodo.condicion() : false);
  }

  function siNo(p) {
    var claseAfirmativo = p.riesgo === "real" ? "real" : "principal";
    if (p.riesgo === "peligro") {
      claseAfirmativo = "peligro";
    }
    var si = boton(p.texto_si || "Sí", claseAfirmativo, function () {
      responder(p.numero, true);
    }, true);
    var no = boton(p.texto_no || "No", p.riesgo === "peligro" ? "principal" : null, function () {
      responder(p.numero, false);
    }, true);
    // En una decisión peligrosa, la opción segura va primero y con el aspecto principal.
    return p.riesgo === "peligro" ? botones(no, si) : botones(si, no);
  }

  function acciones(pregunta, cajaBotones) {
    var barra = el("div", "acciones");
    if (pregunta) { barra.appendChild(el("p", null, pregunta)); }
    barra.appendChild(cajaBotones);
    return barra;
  }

  // Un entero positivo escrito por el docente, o null si no lo es.
  function entero(texto) {
    var t = String(texto).trim();
    if (!/^[0-9]{1,12}$/.test(t)) { return null; }
    var n = Number(t);
    return n > 0 ? n : null;
  }

  function pintarBloque(p, bloque) {
    var caja = el("div", "documento");
    caja.appendChild(el("p", "titulo", bloque.titulo));
    (bloque.lineas || []).forEach(function (linea) { caja.appendChild(el("p", null, linea)); });
    if (bloque.vista !== null && bloque.vista !== undefined) {
      caja.appendChild(botones(boton("Ver vista previa", null, function () {
        var puente = api();
        if (puente) { puente.ver_vista_previa(p.numero, bloque.vista); }
      })));
    }
    return caja;
  }

  var pintores = {
    reposo: function (p) {
      var nodos = [];
      if (p.titulo) { nodos.push(el("h2", null, p.titulo)); }
      parrafos(nodos, p.lineas);
      if (!p.titulo && !(p.lineas || []).length) {
        nodos.push(el("p", "suave", "Esperando…"));
      }
      return nodos;
    },
    confirmar: function (p) {
      var nodos = [el("h2", null, p.titulo)];
      parrafos(nodos, p.lineas);
      (p.bloques || []).forEach(function (bloque) { nodos.push(pintarBloque(p, bloque)); });
      nodos.push(acciones(p.pregunta, siNo(p)));
      return nodos;
    },
    elegir_curso: function (p) {
      var nodos = [el("h2", null, p.titulo)];
      parrafos(nodos, p.lineas, "suave");
      (p.opciones || []).forEach(function (opcion) {
        nodos.push(botones(boton(opcion.texto, null, function () {
          responder(p.numero, opcion.indice);
        }, true)));
      });
      if (p.permite_sin_curso) {
        nodos.push(el("p", "aviso", p.texto_sin_curso));
        nodos.push(botones(boton("No tengo curso de pruebas", null, function () {
          responder(p.numero, { sin_curso: true });
        }, true)));
      }
      if (p.permite_id) {
        var id = campo("Escribe el id del curso (está en la dirección: course/view.php?id=1234)", "id");
        var errorId = zonaDeError(id.nodo);
        var usarId = boton("Usar este id", "principal", function () {
          var n = entero(id.entrada.value);
          if (n === null) {
            ponerError(errorId, "Escribe solo el número que va tras id=");
            return;
          }
          ponerError(errorId, "");
          responder(p.numero, { id: n });
        }, true);
        usarId.condicion = function () { return id.entrada.value.trim() !== ""; };
        botonPrincipal = usarId;
        id.entrada.addEventListener("input", function () {
          ponerError(errorId, "");
          actualizarBoton(usarId);
        });
        nodos.push(id.nodo);
        nodos.push(botones(usarId));
      }
      return nodos;
    },
    elegir_cursos_reales: function (p) {
      var nodos = [el("h2", null, p.titulo)];
      parrafos(nodos, p.lineas, "suave");
      var casillas = [];
      (p.opciones || []).forEach(function (opcion) {
        var etiqueta = el("label", "casilla");
        var marca = document.createElement("input");
        marca.type = "checkbox";
        casillas.push({ marca: marca, indice: opcion.indice });
        marca.addEventListener("change", function () {
          // Ayuda visual: no se pueden marcar más que el máximo.
          if (marca.checked && marcadas() > p.maximo) {
            marca.checked = false;
            ponerError(aviso, "Como mucho " + p.maximo + ".");
          } else if (marca.checked) {
            ponerError(aviso, "");
          }
          contar();
        });
        etiqueta.appendChild(marca);
        etiqueta.appendChild(document.createTextNode(" " + opcion.texto));
        nodos.push(etiqueta);
      });
      var aviso = el("p", "error");
      aviso.hidden = true;
      var contador = el("p", "contador suave", "0 de " + p.maximo + " marcados");
      var id = null;
      if (p.permite_id) {
        id = campo("Escribe los ids de los cursos separados por comas (course/view.php?id=1234)", "ids");
        nodos.push(id.nodo);
      }
      nodos.push(aviso);
      nodos.push(contador);
      var usar = boton("Usar estos cursos", "principal", function () {
        if (id !== null) {
          var partes = id.entrada.value.split(",").map(function (parte) { return parte.trim(); });
          if (!partes.length || partes.some(function (parte) { return parte === ""; })) {
            ponerError(aviso, "Escribe los ids separados por comas.");
            return;
          }
          var ids = partes.map(entero);
          if (ids.some(function (n) { return n === null; })) {
            ponerError(aviso, "Escribe solo números separados por comas.");
            return;
          }
          if (ids.length > p.maximo) {
            ponerError(aviso, "Como mucho " + p.maximo + " cursos.");
            return;
          }
          if (new Set(ids).size !== ids.length) {
            ponerError(aviso, "Hay ids repetidos.");
            return;
          }
          ponerError(aviso, "");
          responder(p.numero, { ids: ids });
          return;
        }
        var indices = casillas.filter(function (c) { return c.marca.checked; })
          .map(function (c) { return c.indice; });
        if (!indices.length) {
          ponerError(aviso, "Marca al menos un curso.");
          return;
        }
        ponerError(aviso, "");
        responder(p.numero, indices);
      }, true);
      function marcadas() {
        return casillas.filter(function (c) { return c.marca.checked; }).length;
      }
      function contar() {
        contador.textContent = marcadas() + " de " + p.maximo + " marcados";
        actualizarBoton(usar);
      }
      usar.condicion = function () {
        return id !== null ? id.entrada.value.trim() !== "" : marcadas() > 0;
      };
      botonPrincipal = usar;
      if (id !== null) {
        id.entrada.addEventListener("input", function () {
          ponerError(aviso, "");
          contar();
        });
      }
      nodos.push(botones(usar));
      contar();
      return nodos;
    },
    configurar: function (p) {
      var url = campo("Dirección de tu aula virtual", "url");
      url.entrada.placeholder = "https://aula.ejemplo.org/tu-centro";
      url.entrada.value = p.url || "";
      var errorUrl = zonaDeError(url.nodo);
      var usuario = campo("Usuario del aula", "usuario");
      usuario.entrada.value = p.usuario || "";
      var errorUsuario = zonaDeError(usuario.nodo);
      var nodos = [el("h2", null, p.titulo)];
      parrafos(nodos, p.lineas, "suave");
      nodos.push(el("p", "suave", "Aquí no se guarda ninguna contraseña."));
      nodos.push(url.nodo);
      nodos.push(usuario.nodo);
      if (p.error) { nodos.push(el("p", "error", p.error)); }
      var guardar = boton("Guardar", "principal", function () {
        var direccion = url.entrada.value.trim();
        var nombre = usuario.entrada.value.trim();
        ponerError(errorUrl, direccion ? "" : "Escribe la dirección del aula.");
        ponerError(errorUsuario, nombre ? "" : "Escribe tu usuario.");
        if (!direccion || !nombre) { return; }
        responder(p.numero, { url: direccion, usuario: nombre });
      }, true);
      botonPrincipal = guardar;
      url.entrada.addEventListener("input", function () { ponerError(errorUrl, ""); });
      usuario.entrada.addEventListener("input", function () { ponerError(errorUsuario, ""); });
      nodos.push(botones(guardar));
      return nodos;
    },
    entrando: function (p) {
      var nodos = [el("h2", null, p.titulo)];
      parrafos(nodos, p.lineas);
      nodos.push(el("p", "suave", "Esperando a que entres en la ventana del aula…"));
      return nodos;
    },
    ampliar: function (p) {
      var nodos = [el("h2", null, p.titulo)];
      parrafos(nodos, p.lineas);
      if (p.plazo > 0) {
        nodos.push(el("p", "aviso", "Si no contestas en " + Math.max(1, Math.round(p.plazo / 60)) +
          " minutos, la sesión se cierra."));
      }
      nodos.push(acciones(p.pregunta, siNo(p)));
      return nodos;
    },
    carpeta: function (p) {
      var nodos = [el("h2", null, p.titulo)];
      parrafos(nodos, p.lineas, "suave");
      (p.opciones || []).forEach(function (opcion) {
        nodos.push(botones(boton(opcion.texto, null, function () {
          var puente = api();
          if (puente) { puente.elegir_reciente(p.numero, opcion.indice); }
        }, true)));
      });
      nodos.push(botones(boton("Elegir otra carpeta…", "principal", function () {
        var puente = api();
        if (puente) { puente.buscar_carpeta(p.numero); }
      }, true)));
      return nodos;
    }
  };

  function pintar(pantalla) {
    var zona = document.getElementById("pantalla");
    var pintor = pintores[pantalla.tipo] || pintores.reposo;
    respuestas = [];
    botonPrincipal = null;
    pintada = Date.now();
    var nodos = pintor(pantalla);
    zona.replaceChildren.apply(zona, nodos);
    document.getElementById("anuncio").textContent = pantalla.titulo || "";
    var pendientes = respuestas;
    setTimeout(function () {
      pendientes.forEach(function (nodo) {
        if (nodo.condicion && !nodo.condicion()) {
          nodo.disabled = true;
        } else {
          nodo.disabled = false;
        }
      });
    }, ESPERA_BOTONES);
    // El foco va al título, nunca a un botón: un Enter que venía en camino no confirma nada.
    if (pantalla.tipo === "configurar") {
      var campos = zona.querySelectorAll("input[type='text']");
      var destino = null;
      for (var i = 0; i < campos.length; i++) {
        if (!campos[i].value) { destino = campos[i]; break; }
      }
      if (!destino && campos.length) { destino = campos[0]; }
      if (destino) { destino.focus(); }
    } else {
      var titulo = zona.querySelector("h2");
      if (titulo) {
        titulo.tabIndex = -1;
        titulo.focus();
      }
    }
  }

  function pintarRegistro(registro) {
    var firma = JSON.stringify(registro);
    if (firma === firmaRegistro) { return; }
    firmaRegistro = firma;
    ultimoRegistro = registro;
    var ul = document.getElementById("registro");
    var abajo = ul.scrollTop + ul.clientHeight >= ul.scrollHeight - 4;
    var items = registro.map(function (linea) {
      return el("li", linea.error ? "error" : null,
        (linea.error ? "Error: " : "") + linea.texto);
    });
    ul.replaceChildren.apply(ul, items);
    if (abajo) { ul.scrollTop = ul.scrollHeight; }
    pintarPlegado(ultimaPregunta);
  }

  function pintarPlegado(pregunta) {
    if (pregunta !== ultimaPregunta) {
      registroPlegado = pregunta;
      ultimaPregunta = pregunta;
    }
    document.getElementById("registro").hidden = registroPlegado;
    var boton = document.getElementById("ver-registro");
    boton.hidden = !pregunta;
    boton.textContent = registroPlegado
      ? "Ver registro (" + ultimoRegistro.length + ")"
      : "Ocultar registro";
  }

  function retirarCierre() {
    cierrePreguntado = false;
    document.getElementById("confirmar-cierre").hidden = true;
  }

  function pintarContexto(estado) {
    var partes = [];
    if (estado.carpeta) { partes.push(estado.carpeta); }
    if (estado.servidor) { partes.push(estado.servidor); }
    document.getElementById("contexto").textContent = partes.join(" · ");
    document.getElementById("cerrar-sesion").hidden = !estado.sesion_abierta;
    if (!estado.sesion_abierta) { retirarCierre(); }
  }

  function sondear() {
    var puente = api();
    if (!puente || !puente.estado || enCurso) { return; }
    enCurso = true;
    puente.estado().then(function (estado) {
      enCurso = false;
      pintarContexto(estado);
      if (estado.pantalla.numero !== ultimo) {
        ultimo = estado.pantalla.numero;
        retirarCierre();  // una pantalla nueva retira la confirmación de cierre
        pintar(estado.pantalla);
      }
      pintarRegistro(estado.registro);
      pintarPlegado(estado.pregunta === true);
    }, function () {
      enCurso = false;
    });
  }

  document.getElementById("pantalla").addEventListener("keydown", function (evento) {
    if (evento.key !== "Enter" || !evento.target || evento.target.tagName !== "INPUT") { return; }
    evento.preventDefault();
    if (botonPrincipal && !botonPrincipal.disabled) { botonPrincipal.click(); }
  });

  document.getElementById("cerrar-sesion").addEventListener("click", function () {
    cierrePreguntado = true;
    document.getElementById("confirmar-cierre").hidden = false;
  });

  document.getElementById("seguir-trabajando").addEventListener("click", retirarCierre);

  document.getElementById("cerrar-de-verdad").addEventListener("click", function () {
    var puente = api();
    if (puente && ultimo !== null) { puente.terminar(ultimo); }
  });

  document.getElementById("ver-registro").addEventListener("click", function () {
    registroPlegado = !registroPlegado;
    pintarPlegado(ultimaPregunta);
  });

  setInterval(sondear, 300);
})();
</script>
</body>
</html>
