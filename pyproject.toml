[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiza"
version = "0.43.0"
license = "MIT"
license-files = ["LICENSE"]
description = "CLI y skill para publicar contenidos en tu aula virtual Moodle sin exponer datos del alumnado"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-moodle==1.0.2",
    "requests>=2.31",  # se importa directamente (ya llegaba con python-moodle)
    "markdown-it-py>=3.0",
    "platformdirs>=4.0",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",  # el filtro valida el árbol que construye un navegador
    "tinycss2>=1.3",  # análisis de los atributos style
    "pyyaml>=6.0",
    "tzdata>=2024.1; sys_platform == 'win32'",  # zoneinfo: Windows no trae la base de zonas
    "python-docx>=1.2,<2",
    "pypdf>=6,<7",
    "lxml>=5,<7",  # se importa directamente; ya llegaba con python-docx
    "resvg-py==0.5.0",
    "normativa-madrid @ https://github.com/balejosg/normativa-madrid/releases/download/v0.1.0/normativa_madrid-0.1.0-py3-none-any.whl#sha256=09185b3b1920e8f85f3795f02c4525f06ba8e1aa299c72a3cf96d742854a4609",
]

[project.scripts]
tiza = "tiza.cli:main"

[project.gui-scripts]
tiza-panel = "tiza.panel:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ventana = [
    "pywebview>=6.2,<7",
    "pywebview[pyside6]>=6.2,<7; sys_platform == 'linux'",
]  # ventana de entrada y panel; en Windows usa WebView2 y en Linux, Qt (PySide6, LGPL)

[tool.hatch.metadata]
allow-direct-references = true  # normativa-madrid se instala desde su wheel publicado

[tool.hatch.build.targets.wheel]
packages = ["src/tiza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "SIM", "I"]
# E741: los tests usan «l» en comprensiones cortas.
# SIM102/SIM105: preferencias de estilo que el código no sigue.
ignore = ["E741", "SIM102", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["tiza", "dobles"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["tiza"]
