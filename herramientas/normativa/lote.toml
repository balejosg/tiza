# Manifiesto del lote de normativa: una entrada por ficha del paquete, con el extractor y los
# parámetros exactos con que se generó (los de la última regeneración, que reproduce los datos
# byte a byte). `regenerar.py` lo lee; para preparar un curso nuevo se cambian aquí las normas,
# los cursos académicos y la fecha de revisión, y después `comprobar`.
#
# extractor: descriptores | lomloe | titulo | modulo | transversal | optativo | requisitos
# `argumentos` son los del extractor sin los comunes (--ficha en los de FP, --cursos-academicos,
# --cache y --salida), que pone `regenerar`. Los tres de requisitos salen de una sola ejecución
# (el detalle está en requisitos.toml).

