# Fuentes oficiales del lote de normativa de Madrid (curso 2026-27).
#
# Una tabla [[norma]] por disposición. Solo la usa el mantenedor: `descargar` baja cada
# `url_pdf` y comprueba su `sha256`; `comprobar` lee `sustituciones` y `recuentos`.
# Los PDF y XML van a una caché fuera del repositorio y nunca se commitean.
#
# - `id`: referencia del boletín en minúsculas; `fecha`: la de la disposición (la de su
#   nombre) o, en una corrección de errores sin fecha propia, la de su publicación.
# - `titulo`: el del sumario del boletín (BOCM) o el de los metadatos (BOE), sin el punto
#   final. Si una corrección de errores lo arregla, el corregido.
# - `rango = "correccion"`: correcciones de errores publicadas como disposición propia.
#   Su `numero` es «del <norma corregida>», de modo que se citan como «corrección de
#   errores del Decreto 27/2025».
# - `url_api`: solo para las normas del BOE con texto consolidado en su API (la API
#   responde 404 para las que no lo tienen, como el RD 450/2010).
# - `recuentos`: los escribe el mantenedor al extraer cada ficha (tarea 5), contados en el
#   boletín y no en lo extraído.
#
# Investigado y descargado el 2026-10-18.

